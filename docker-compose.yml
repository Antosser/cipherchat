version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend-vue/Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    restart: unless-stopped
